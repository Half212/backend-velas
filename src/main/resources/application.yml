spring:
  application:
    name: backend

  # Conexao com o Banco de Dados (Neon / Local)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-empty-band-b6xh2cfu-pooler.c-2.sa-east-1.aws.neon.tech/ecommerce_db?sslmode=require&channelBinding=require}
    username: ${DB_USER:neondb_owner}
    password: ${DB_PASSWORD:npg_w9HG5qYxKRnI}
    driver-class-name: org.postgresql.Driver

  # Comportamento do JPA / Hibernate
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Migracoes com Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
