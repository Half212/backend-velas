spring:
  application:
    name: backend

  # Conexão com o Banco de Dados (Neon / Local)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Comportamento do JPA / Hibernate
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      # Em homologação podemos usar 'update'. Em produção, 'validate'.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Migrações com Flyway
  flyway:
    url: ${DB_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# Variável customizada para uso no CORS
app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}