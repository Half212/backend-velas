# spring.application.name=backend

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    # Como estamos usando Flyway, o Hibernate NÃO deve alterar as tabelas
    hibernate:
      ddl-auto: validate 

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080